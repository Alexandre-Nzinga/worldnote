<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>WorldNote</title>
    <script>
      // Apply saved primary accent before first paint.
      (function () {
        try {
          var root = document.documentElement;
          root.classList.remove("light");
          root.classList.add("dark");

          var storedPrimary = localStorage.getItem("wn-primary-color-style");
          if (storedPrimary) {
            var primaryStyle = JSON.parse(storedPrimary);
            if (primaryStyle.primary) {
              root.style.setProperty("--wn-primary", primaryStyle.primary);
            }
            if (primaryStyle.hover) {
              root.style.setProperty("--wn-primary-hover", primaryStyle.hover);
            }
            if (primaryStyle.foreground) {
              root.style.setProperty(
                "--wn-primary-foreground",
                primaryStyle.foreground,
              );
            }
            var style = document.createElement("style");
            style.id = "wn-primary-accent";
            style.textContent =
              ":root { --wn-primary: " +
              primaryStyle.primary +
              " !important; --wn-primary-hover: " +
              primaryStyle.hover +
              " !important; --wn-primary-foreground: " +
              primaryStyle.foreground +
              " !important; }";
            document.head.appendChild(style);
          }
        } catch (error) {
          document.documentElement.classList.add("dark");
        }
      })();
    </script>
  </head>
  <body class="h-screen overflow-hidden bg-wn-bg text-wn-text antialiased">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
