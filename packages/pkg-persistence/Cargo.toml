[package]
name = "worldnote_persistence"
version = "0.1.0"
edition = "2021"
description = "WorldNote repository and local-first persistence (JSON + SQLite index)"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
rusqlite = { version = "0.32", features = ["bundled"] }
notify = "6.1"
uuid = { version = "1.11", features = ["v4", "serde"] }
thiserror = "2.0"
tokio = { version = "1.42", features = ["rt-multi-thread", "macros", "sync", "time"] }

[dev-dependencies]
tempfile = "3.14"
